services:
    db:
        image: postgres:15-alpine
        container_name: medical-chatbot-postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        env_file:
            - ../.env
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d medical_chat"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - medical-chatbot

    api:
        build:
            context: ../services/api
            dockerfile: Dockerfile
        container_name: medical-chatbot-api
        volumes:
            - ../services/api:/app
        ports:
            - "8000:8000"
        env_file:
            - ../.env
        depends_on:
            db:
                condition: service_healthy
        command: >
            sh -c "
              alembic upgrade head &&
              uvicorn main:app --host 0.0.0.0 --port 8000 --root-path /backend --reload
            "
        networks:
            - medical-chatbot
        environment:
            - PYTHONUNBUFFERED=1

    llm-worker:
        build:
            context: ../services/llm-worder
            dockerfile: Dockerfile
        container_name: medical-chatbot-llm-worker
        volumes:
            - ../services/llm-worker:app
        env_file:
            - ../.env
        depends_on:
            - api
        command: python app.py
        networks:
            - medical-chatbot
        environment:
            - PYTHONUNBUFFERED=1

    frontend:
        build:
            context: ../frontend
            dockerfile: Dockerfile
        container_name: medical-chatbot-frontend
        volumes:
            - ../frontend:app
            - /app/node_modules
        ports:
            - "5173:5173"
        env_file:
            - ../frontend/.env
        depends_on:
            - api
        networks:
            - medical-chatbot

volumes:
    postgres_data:

networks:
    medical-chatbot:
        driver: bridge
