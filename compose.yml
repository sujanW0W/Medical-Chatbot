version: "3.8"

services:
    chatbot:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8501:8501"
        env_file:
            - .env
        # Optional: Mount the current directory into the container for easier development/debugging
        # volumes:
        #   - .:/app
        command:
            [
                "streamlit",
                "run",
                "app.py",
                "--server.port",
                "8501",
                "--server.address",
                "0.0.0.0",
            ]
