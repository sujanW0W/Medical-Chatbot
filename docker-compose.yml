services:
    db:
        image: postgres:15-alpine
        ports:
          - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        env_file:
            - .env
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d medical_chat"]
            interval: 5s
            timeout: 5s
            retries: 5

    app:
        build: .
        volumes:
            - .:/app
        ports:
            - "8000:8000"
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        command: >
          sh -c "
            alembic upgrade head &&
            uvicorn api.main:app --host 0.0.0.0 --port 8000 --root-path /backend --reload
          "

volumes:
    postgres_data:
